apply from: 'gradle/scripts/helpers.gradle'

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name 'CurseMaven'
                url 'https://cursemaven.com'
            }
        }
        filter {
            includeGroup 'curse.maven'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name 'Modrinth'
                url 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }

    mavenLocal() // Must be last for caching to work
}

/**
 * NOT DEPENDENCIES:
 *  - runtimeOnly: not required at all for the mod, added for developer convenience to run targets
 * OPTIONAL DEPENDENCIES:
 *  - compileOnly: will not be included in developer run targets
 *  - devOnlyNonPublishable: will be included in developer run targets
 * REQUIRED DEPENDENCIES:
 *  - implementation: mods or other jars that are required to be installed alongside this mod
 */
dependencies {
    // Include StripLatestForgeRequirements by default for the dev env
    runtimeOnly 'com.cleanroommc:strip-latest-forge-requirements:1.0'
    // Include OSXNarratorBlocker by default for the dev env, for M1+ Macs
    runtimeOnly 'com.cleanroommc:osxnarratorblocker:1.0'

    // ---- Required dependencies ----

    // Modular Machinery CE
    implementation rfg.deobf("curse.maven:modularmachinery-community-edition-817377:7372951")

    // ---- Optional integrations ----
    devOnlyNonPublishable rfg.deobf("curse.maven:ae2-extended-life-570458:6302098")
    devOnlyNonPublishable rfg.deobf("curse.maven:the-one-probe-245211:2667280")
    compileOnly rfg.deobf("curse.maven:Mekanism-268560:2835175")
    compileOnly rfg.deobf("curse.maven:mekanism-energistics-1027681:5408319")

    // ---- Optional (but required): MixinBooter ----
    devOnlyNonPublishable rfg.deobf("curse.maven:mixin-booter-419286:4750909")

}